name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matcher
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/matcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (unit + PostgreSQL/pgvector integration + UI smoke test)
        run: pytest -q
      - name: Evaluation and quality gate
        run: |
          hpm init-db --reset
          hpm ingest data/datasheets
          hpm eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
