[project]
name = "hydraulic-product-matcher"
version = "0.1.0"
description = "AI-assisted competitor datasheet extraction, product database and explainable product matching for hydraulic components"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jatin Mathur" }]
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4.2"]

[project.scripts]
hpm = "hpm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs PostgreSQL with pgvector (set DATABASE_URL)"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"scripts/catalog.py" = ["E501"]  # one product per row reads better as a table
